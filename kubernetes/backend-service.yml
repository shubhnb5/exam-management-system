apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: examflow
spec:
  selector:
    app: backend
  type: NodePort
  sessionAffinity: None
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  ports:
  - name: backend
    protocol: TCP
    port: 8000
    targetPort: 8000
    nodePort: 30082
