apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend-deployment
  namespace: examflow
  labels:
    app: backend

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend
          image: examflow-backend:1.0.0

          envFrom:
            - configMapRef:
                name: backend-config

          ports:
            - containerPort: 8000
