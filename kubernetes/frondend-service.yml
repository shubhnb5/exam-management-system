apiVersion: v1
kind: Service
metadata:
  name: frontend-admin-service
  namespace: examflow
  labels:
    app: frontend-admin
spec:
  selector:
    app: frontend-admin
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80

---

apiVersion: v1
kind: Service
metadata:
  name: frontend-scanner-service
  namespace: examflow
  labels:
    app: frontend-scanner
spec:
  selector:
    app: frontend-scanner
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
