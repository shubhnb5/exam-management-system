kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 5000
        listenAddress: "0.0.0.0"
        protocol: TCP

  - role: control-plane
    extraPortMappings:
      - containerPort: 30081
        hostPort: 5001
        listenAddress: "0.0.0.0"
        protocol: TCP

  - role: control-plane
    extraPortMappings:
      - containerPort: 30082
        hostPort: 8000
        listenAddress: "0.0.0.0"
        protocol: TCP