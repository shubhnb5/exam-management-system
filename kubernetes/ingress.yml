apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: examflow-ingress
  namespace: examflow
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: admin.examflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-admin-service
                port:
                  number: 80
    - host: scanner.examflow.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-scanner-service
                port:
                  number: 80
