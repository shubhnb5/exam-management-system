server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Vite's build output hashes these filenames per build, so they're safe
    # to cache forever — a new build always gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html (and manifest.json/icons) must never be cached long-term:
    # index.html references the current build's hashed asset filenames. A
    # stale cached copy points at assets deleted by the next deploy, which
    # 404 and leave the page blank — this is what "no-cache" prevents.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
