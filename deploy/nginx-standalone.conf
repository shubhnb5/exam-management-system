# Drop-in location blocks for a bare-metal (non-Docker) nginx host serving
# combine-mentor.scoler.co.in directly — this is NOT used by this repo's own
# docker-compose.yml (that uses Caddy — see ../Caddyfile). It exists because
# the live server was found to be running a standalone Ubuntu nginx install
# instead, with /admin/ and /scan/ each 404-ing on their built JS/CSS assets.
#
# Add these `location` blocks inside the EXISTING `server { ... }` block for
# combine-mentor.scoler.co.in (the one that already terminates TLS and serves
# whatever currently answers at "/") — do not create a second server block,
# and do not touch the existing "/" location.
#
# Adjust the two `alias` paths below to wherever you actually copy each
# app's built `dist/` folder on this server.

    # --- Admin dashboard, served at /admin/ ---
    location /admin/assets/ {
        alias /var/www/examflow/admin/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /admin/ {
        alias /var/www/examflow/admin/;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache";
    }

    # --- Scanner PWA, served at /scan/ ---
    location /scan/assets/ {
        alias /var/www/examflow/scan/assets/;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /scan/ {
        alias /var/www/examflow/scan/;
        index index.html;
        try_files $uri $uri/ /scan/index.html;
        add_header Cache-Control "no-cache";
    }

    # --- Backend API, served at /api/ ---
    # Already working on the live server as of this investigation (confirmed
    # via curl — /api/ and /api/health both reach the FastAPI backend
    # correctly) — included here only for completeness/reference. Adjust the
    # upstream address if it differs from what's actually configured live.
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
