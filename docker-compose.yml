services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examflow}
      POSTGRES_DB: ${POSTGRES_DB:-examflow}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: examflow/backend:latest
    container_name: examflow-backend
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-examflow}:${POSTGRES_PASSWORD:-examflow}@db:5432/${POSTGRES_DB:-examflow}
    volumes:
      - ./ticket_template:/ticket_template
      - ./backend/storage:/app/storage

  frontend-admin:
    image: examflow/frontend-admin:latest
    container_name: examflow-frontend-admin
    env_file: ./frontend-admin/.env.example
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend

  frontend-scanner:
    image: examflow/frontend-scanner:latest
    container_name: examflow-frontend-scanner
    env_file: ./frontend-scanner/.env.example
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
volumes:
  db_data:
