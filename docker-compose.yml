services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examflow}
      POSTGRES_DB: ${POSTGRES_DB:-examflow}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-examflow}:${POSTGRES_PASSWORD:-examflow}@db:5432/${POSTGRES_DB:-examflow}
    volumes:
      - ./ticket_template:/ticket_template
      - ./backend/storage:/app/storage

  frontend-admin:
    build:
      context: ./frontend-admin
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-/api}
        VITE_BASE_PATH: ${ADMIN_BASE_PATH:-/admin/}
    restart: unless-stopped
    depends_on:
      - backend

  frontend-scanner:
    build:
      context: ./frontend-scanner
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-/api}
        VITE_BASE_PATH: ${SCANNER_BASE_PATH:-/scanner/}
    restart: unless-stopped
    depends_on:
      - backend

  # Terminates real HTTPS (via Let's Encrypt, automatic) for all three services
  # above, none of which are reachable directly from outside anymore — this is
  # the only container that publishes ports to the host. Camera access in the
  # scanner app requires a secure (https) context, which is the whole reason
  # this exists: plain HTTP over a bare server IP can't provide that.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend-admin
      - frontend-scanner

volumes:
  db_data:
  caddy_data:
  caddy_config:
