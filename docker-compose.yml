services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-examflow}
      POSTGRES_DB: ${POSTGRES_DB:-examflow}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: examflow/backend:1.0.0
    container_name: examflow-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-examflow}:${POSTGRES_PASSWORD:-examflow}@db:5432/${POSTGRES_DB:-examflow}
    volumes:
      - ./ticket_template:/ticket_template
      - ./backend/storage:/app/storage

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://combine-mentor.scoler.co.in/api/
        VITE_BASE_PATH: /admin/
    image: examflow/frontend-admin:1.0.1
    container_name: examflow-frontend-admin
    ports:
      - "8080:80"
    env_file: ./frontend-admin/.env.example
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend

  frontend-scanner:
    build:
      context: ./frontend-scanner
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://combine-mentor.scoler.co.in/api/
        VITE_BASE_PATH: /scan/
    image: examflow/frontend-scanner:1.0.1
    container_name: examflow-frontend-scanner
    ports:
      - "8081:80"
    env_file: ./frontend-scanner/.env.example
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend

  frontend-student:
    build:
      context: ./frontend-student
      dockerfile: Dockerfile
      args:
        VITE_API_URL: https://combine-mentor.scoler.co.in/api/
        VITE_BASE_PATH: /student/
    image: examflow/frontend-student:1.0.1
    container_name: examflow-frontend-student
    ports:
      - "8082:80"
    env_file: ./frontend-student/.env.example
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - backend
volumes:
  db_data:
